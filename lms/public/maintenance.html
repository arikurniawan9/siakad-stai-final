<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemeliharaan Sistem — SALAM STAI AL-ITTIHAD</title>
  <style>
    :root {
      --primary: #047857;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #ECFDF5;
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 1rem 0;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">STAI AL-ITTIHAD CIANJUR</div>
    <h1>SALAM Sedang dalam Pemeliharaan</h1>
    <p>Sistem Aplikasi Layanan Akademik dan Mahasiswa (SALAM) saat ini sedang menjalani pemeliharaan berkala untuk peningkatan performa dan keamanan.</p>
    <p>Silakan coba kembali beberapa saat lagi. Mohon maaf atas ketidaknyamanan yang terjadi.</p>
    <button class="btn" onclick="window.location.reload()">Segarkan Halaman</button>
  </div>
</body>
</html>
